services:
  api:
    build:
      context: ../..
      dockerfile: deploy/coolify/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set CLERK_PUBLISHABLE_KEY in Coolify}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY in Coolify}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:?Set ADMIN_USER_IDS in Coolify}
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  web:
    build:
      context: ../..
      dockerfile: deploy/coolify/Dockerfile.web
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY in Coolify}
        BASE_PATH: /
        PORT: "4173"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
