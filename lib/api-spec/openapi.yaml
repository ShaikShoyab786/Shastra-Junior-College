openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Shared API for Shastra Junior College public content and administration.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: home
    description: Public homepage content
  - name: admin
    description: Protected homepage content administration
  - name: enquiries
    description: Public admissions enquiries and the protected staff inbox
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /admin/auth/session:
    get:
      operationId: getAdminAuthSession
      tags: [admin]
      summary: Check the password-based admin session
      responses:
        "200":
          description: Current admin session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionState"
  /admin/auth/login:
    post:
      operationId: loginAdmin
      tags: [admin]
      summary: Sign in to the admin workspace with its configured password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordLogin"
      responses:
        "200":
          description: Admin session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionState"
        "401":
          description: Password is incorrect
        "429":
          description: Too many sign-in attempts
        "503":
          description: Admin sign-in is not configured
  /admin/auth/logout:
    post:
      operationId: logoutAdmin
      tags: [admin]
      summary: Sign out of the admin workspace
      responses:
        "200":
          description: Admin session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionState"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /home:
    get:
      operationId: getHomePage
      tags: [home]
      summary: Get published homepage content
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePage"
  /pages/{pageSlug}:
    get:
      operationId: getCmsPage
      tags: [home]
      summary: Get published About, Faculty, Gallery, Courses, Knowledge Hub, or Contact content
      parameters:
        - name: pageSlug
          in: path
          required: true
          schema:
            type: string
            enum: [about, faculty, gallery, courses, knowledge-hub, contact]
      responses:
        "200":
          description: Published page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"
        "404":
          description: Page not found
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit a public admissions enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicEnquirySubmission"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
        "400":
          description: The enquiry does not match the active form.
  /admin/enquiries:
    get:
      operationId: getAdminEnquiries
      tags: [admin]
      summary: List admissions enquiries for authorized staff
      responses:
        "200":
          description: Enquiry inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnquiries"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/enquiries/{id}:
    patch:
      operationId: updateEnquiry
      tags: [admin]
      summary: Update an enquiry's inbox status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnquiryStatus"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnquiry"
        "400":
          description: Invalid status
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Enquiry not found
    delete:
      operationId: deleteEnquiry
      tags: [admin]
      summary: Soft-delete an enquiry so it can be restored
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted enquiry identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryActionResult"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Enquiry not found
  /admin/enquiries/{id}/notes:
    get:
      operationId: getAdminEnquiryNotes
      tags: [admin]
      summary: List private staff notes for an enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Private enquiry notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnquiryNotes"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Enquiry not found
    post:
      operationId: createAdminEnquiryNote
      tags: [admin]
      summary: Add a private staff note to an enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryNoteInput"
      responses:
        "201":
          description: Private note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryNote"
        "400":
          description: Invalid note
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Enquiry not found
  /admin/enquiries/{id}/restore:
    post:
      operationId: restoreEnquiry
      tags: [admin]
      summary: Restore a soft-deleted enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Restored enquiry identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryActionResult"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Deleted enquiry not found
  /admin/home:
    get:
