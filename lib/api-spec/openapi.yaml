openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Shared API for Shastra Junior College public content and administration.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: home
    description: Public homepage content
  - name: admin
    description: Protected homepage content administration
  - name: enquiries
    description: Public admissions enquiries and the protected staff inbox
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /home:
    get:
      operationId: getHomePage
      tags: [home]
      summary: Get published homepage content
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePage"
  /pages/{pageSlug}:
    get:
      operationId: getCmsPage
      tags: [home]
      summary: Get published About, Faculty, Gallery, Courses, Knowledge Hub, or Contact content
      parameters:
        - name: pageSlug
          in: path
          required: true
          schema:
            type: string
            enum: [about, faculty, gallery, courses, knowledge-hub, contact]
      responses:
        "200":
          description: Published page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"
        "404":
          description: Page not found
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit a public admissions enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicEnquirySubmission"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
        "400":
          description: The enquiry does not match the active form.
  /admin/enquiries:
    get:
      operationId: getAdminEnquiries
      tags: [admin]
      summary: List admissions enquiries for authorized staff
      responses:
        "200":
          description: Enquiry inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnquiries"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/enquiries/{id}:
    patch:
      operationId: updateEnquiry
      tags: [admin]
      summary: Update an enquiry's inbox status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnquiryStatus"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnquiry"
        "400":
          description: Invalid status
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Enquiry not found
    delete:
      operationId: deleteEnquiry
      tags: [admin]
      summary: Soft-delete an enquiry so it can be restored
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted enquiry identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryActionResult"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Enquiry not found
  /admin/enquiries/{id}/restore:
    post:
      operationId: restoreEnquiry
      tags: [admin]
      summary: Restore a soft-deleted enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Restored enquiry identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryActionResult"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Deleted enquiry not found
  /admin/home:
    get:
      operationId: getAdminHome
      tags: [admin]
      summary: Get all homepage content for an authorized admin
      responses:
        "200":
          description: Homepage content including hidden sections and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePage"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /courses-menu:
    get:
      operationId: getCoursesMenu
      tags: [public]
      summary: Get the visible Courses mega-menu content
      responses:
        "200":
          description: Public Courses mega-menu content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursesMenuSettings"
        "503":
          description: Courses menu content is not available
  /admin/courses-menu:
    get:
      operationId: getAdminCoursesMenu
      tags: [admin]
      summary: Get all Courses mega-menu content for an authorized admin
      responses:
        "200":
          description: Courses mega-menu content including hidden items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursesMenuSettings"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
    patch:
      operationId: updateAdminCoursesMenu
      tags: [admin]
      summary: Update Courses mega-menu content for an authorized admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursesMenuPatch"
      responses:
        "200":
          description: Updated Courses mega-menu content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoursesMenuSettings"
        "400":
          description: Invalid menu content
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /knowledge-hub-menu:
    get:
      operationId: getKnowledgeHubMenu
      tags: [public]
      summary: Get the Knowledge Hub mega-menu content
      responses:
        "200":
          description: Public Knowledge Hub mega-menu content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeHubMenuSettings"
        "503":
          description: Knowledge Hub menu content is not available
  /admin/knowledge-hub-menu:
    get:
      operationId: getAdminKnowledgeHubMenu
      tags: [admin]
      summary: Get Knowledge Hub mega-menu content for an authorized admin
      responses:
        "200":
          description: Knowledge Hub mega-menu content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeHubMenuSettings"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
    patch:
      operationId: updateAdminKnowledgeHubMenu
      tags: [admin]
      summary: Update Knowledge Hub mega-menu content for an authorized admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeHubMenuPatch"
      responses:
        "200":
          description: Updated Knowledge Hub mega-menu content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeHubMenuSettings"
        "400":
          description: Invalid menu content
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/pages/{pageSlug}:
    get:
      operationId: getAdminCmsPage
      tags: [admin]
      summary: Get About, Faculty, Gallery, Courses, Knowledge Hub, or Contact content for authorized staff
      parameters:
        - name: pageSlug
          in: path
          required: true
          schema:
            type: string
            enum: [about, faculty, gallery, courses, knowledge-hub, contact]
      responses:
        "200":
          description: Page content including unpublished sections and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Page not found
  /admin/home/summary:
    get:
      operationId: getAdminHomeSummary
      tags: [admin]
      summary: Get homepage publishing counts
      responses:
        "200":
          description: Homepage publishing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHomeSummary"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/site-settings:
    patch:
      operationId: updateSiteSettings
      tags: [admin]
      summary: Update shared college identity and navigation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Updated shared site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          description: Invalid settings
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a public college asset from PRIVATE_OBJECT_DIR
      description: Streams a logo or other published asset uploaded by an authorized admin.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within PRIVATE_OBJECT_DIR, such as uploads/uuid.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/sections:
    post:
      operationId: createContentSection
      tags: [admin]
      summary: Create a page section
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentSectionInput"
      responses:
        "201":
          description: Created section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSection"
        "400":
          description: Invalid section
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/sections/{id}:
    patch:
      operationId: updateContentSection
      tags: [admin]
      summary: Update or reorder a page section
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentSectionUpdate"
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSection"
        "400":
          description: Invalid section
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Section not found
    delete:
      operationId: deleteContentSection
      tags: [admin]
      summary: Delete a page section and its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Section deleted
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Section not found
  /admin/items:
    post:
      operationId: createContentItem
      tags: [admin]
      summary: Create a repeatable homepage item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          description: Invalid item
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/items/{id}:
    patch:
      operationId: updateContentItem
      tags: [admin]
      summary: Update, hide, or reorder a repeatable homepage item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          description: Invalid item
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Item not found
    delete:
      operationId: deleteContentItem
      tags: [admin]
      summary: Delete a repeatable homepage item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Item deleted
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Item not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NavigationLink:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        path:
          type: string
          minLength: 1
          maxLength: 200
      required: [label, path]
    CoursesMenuBrandPanel:
      type: object
      properties:
        collegeName:
          type: string
          maxLength: 120
        tagline:
          type: string
          maxLength: 120
        headline:
          type: string
          maxLength: 160
        supportingText:
          type: string
          maxLength: 500
        logoImageUrl:
          type: ["string", "null"]
          maxLength: 2048
        logoImageAlt:
          type: string
          maxLength: 180
        backgroundImageUrl:
          type: ["string", "null"]
          maxLength: 2048
        backgroundImageAlt:
          type: string
          maxLength: 180
      required:
        - collegeName
        - tagline
        - headline
        - supportingText
        - logoImageUrl
        - logoImageAlt
        - backgroundImageUrl
        - backgroundImageAlt
    CoursesMenuHeading:
      type: object
      properties:
        eyebrow:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 160
        pathwayBadge:
          type: ["string", "null"]
          maxLength: 100
      required: [eyebrow, title, pathwayBadge]
    CoursesMenuCard:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[A-Za-z0-9_-]+$"
        order:
          type: integer
          minimum: 0
        title:
          type: string
          maxLength: 120
        category:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 400
        destination:
          type: string
          maxLength: 2048
        isVisible:
          type: boolean
        icon:
          type: ["string", "null"]
          maxLength: 60
        tint:
          type: ["string", "null"]
          pattern: "^#[0-9A-Fa-f]{6}$"
        imageUrl:
          type: ["string", "null"]
          maxLength: 2048
        imageAlt:
          type: string
          maxLength: 180
      required:
        - id
        - order
        - title
        - category
        - description
        - destination
        - isVisible
        - icon
        - tint
        - imageUrl
        - imageAlt
    CoursesMenuComingSoonCard:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 400
        statusLabel:
          type: string
          maxLength: 60
        isVisible:
          type: boolean
      required: [title, description, statusLabel, isVisible]
    CoursesMenuBenefit:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[A-Za-z0-9_-]+$"
        order:
          type: integer
          minimum: 0
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 300
        icon:
          type: ["string", "null"]
          maxLength: 60
        isVisible:
          type: boolean
      required: [id, order, title, description, icon, isVisible]
    CoursesMenuLink:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[A-Za-z0-9_-]+$"
        order:
          type: integer
          minimum: 0
        label:
          type: string
          maxLength: 100
        destination:
          type: string
          maxLength: 2048
        isVisible:
          type: boolean
      required: [id, order, label, destination, isVisible]
    CoursesMenuButton:
      allOf:
        - $ref: "#/components/schemas/CoursesMenuLink"
        - type: object
          properties:
            variant:
              type: string
              enum: [primary, secondary]
          required: [variant]
    CoursesMenuSettings:
      type: object
      properties:
        brandPanel:
          $ref: "#/components/schemas/CoursesMenuBrandPanel"
        heading:
          $ref: "#/components/schemas/CoursesMenuHeading"
        courseCards:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/CoursesMenuCard"
        comingSoonCard:
          anyOf:
            - $ref: "#/components/schemas/CoursesMenuComingSoonCard"
            - type: "null"
        benefits:
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/CoursesMenuBenefit"
        utilityLinks:
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/CoursesMenuLink"
        ctaButtons:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/CoursesMenuButton"
      required:
        - brandPanel
        - heading
        - courseCards
        - comingSoonCard
        - benefits
        - utilityLinks
        - ctaButtons
    CoursesMenuPatch:
      type: object
      properties:
        brandPanel:
          $ref: "#/components/schemas/CoursesMenuBrandPanel"
        heading:
          $ref: "#/components/schemas/CoursesMenuHeading"
        courseCards:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/CoursesMenuCard"
        comingSoonCard:
          anyOf:
            - $ref: "#/components/schemas/CoursesMenuComingSoonCard"
            - type: "null"
        benefits:
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/CoursesMenuBenefit"
        utilityLinks:
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/CoursesMenuLink"
        ctaButtons:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/CoursesMenuButton"
    KnowledgeHubMenuItem:
      type: object
      properties:
        key:
          type: string
          enum: [article-hub, video-hub, study-resources, exam-updates]
        order:
          type: integer
          minimum: 0
          maximum: 3
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 240
      required: [key, order, title, description]
    KnowledgeHubMenuHeading:
      type: object
      properties:
        eyebrow:
          type: string
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 140
        description:
          type: string
          maxLength: 360
      required: [eyebrow, title, description]
    KnowledgeHubMenuSettings:
      type: object
      properties:
        heading:
          $ref: "#/components/schemas/KnowledgeHubMenuHeading"
        items:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/KnowledgeHubMenuItem"
        ctaLabel:
          type: string
          minLength: 1
          maxLength: 100
      required: [heading, items, ctaLabel]
    KnowledgeHubMenuPatch:
      type: object
      properties:
        heading:
          $ref: "#/components/schemas/KnowledgeHubMenuHeading"
        items:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/KnowledgeHubMenuItem"
        ctaLabel:
          type: string
          minLength: 1
          maxLength: 100
    SocialProfileLinks:
      type: object
      additionalProperties: false
      properties:
        instagram:
          type: string
          maxLength: 2048
        facebook:
          type: string
          maxLength: 2048
        youtube:
          type: string
          maxLength: 2048
        linkedin:
          type: string
          maxLength: 2048
        tiktok:
          type: string
          maxLength: 2048
        x:
          type: string
          maxLength: 2048
    ThemePreset:
      type: string
      enum:
        - shastra-blue-red
        - heritage-ink-gold
        - teal-copper
        - charcoal-saffron
        - mulberry-rosewood
        - olive-parchment
        - custom
    SiteSettings:
      type: object
      properties:
        id:
          type: string
        collegeName:
          type: string
        headerTagline:
          type: string
        logoUrl:
          type: ["string", "null"]
        navigation:
          type: array
          items:
            $ref: "#/components/schemas/NavigationLink"
        footerNote:
          type: string
        socialLinks:
          $ref: "#/components/schemas/SocialProfileLinks"
        themePreset:
          $ref: "#/components/schemas/ThemePreset"
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        surfaceColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        introEnabled:
          type: boolean
        introQuote:
          type: string
          maxLength: 80
        scrollCtaEnabled:
          type: boolean
        floatingWhatsAppEnabled:
          type: boolean
        cursorSparkleEnabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - collegeName
        - headerTagline
        - logoUrl
        - navigation
        - footerNote
        - socialLinks
        - themePreset
        - primaryColor
        - accentColor
