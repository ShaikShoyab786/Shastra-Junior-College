        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/article-hub/articles/{id}:
    patch:
      operationId: updateArticle
      tags: [admin]
      summary: Update an Article Hub article
      parameters:
        - name: id
          in: path
