        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Category not found
    delete:
      operationId: deleteVideoCategory
      tags: [admin]
      summary: Delete an unused Video Hub category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
