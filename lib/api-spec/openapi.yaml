        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/study-resources/categories:
    post:
      operationId: createStudyResourceCategory
      tags: [admin]
      summary: Create a Study Resources category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyResourceCategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyResourceCategory"
        "400":
          description: Invalid category
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
