  /admin/article-hub/categories/{id}:
    patch:
      operationId: updateArticleCategory
      tags: [admin]
      summary: Update an Article Hub category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleCategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleCategory"
        "400":
          description: Invalid category
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Category not found
    delete:
      operationId: deleteArticleCategory
      tags: [admin]
      summary: Delete an unused Article Hub category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Category deleted
        "400":
          description: Category still contains articles
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Category not found
  /admin/article-hub/articles:
    post:
      operationId: createArticle
      tags: [admin]
      summary: Create an Article Hub article
      requestBody:
        required: true
        content:
          application/json:
            schema:
