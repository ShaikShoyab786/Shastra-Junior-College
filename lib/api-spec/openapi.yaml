openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Shared API for Shastra Junior College public content and administration.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: home
    description: Public homepage content
  - name: admin
    description: Protected homepage content administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /home:
    get:
      operationId: getHomePage
      tags: [home]
      summary: Get published homepage content
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePage"
  /admin/home:
    get:
      operationId: getAdminHome
      tags: [admin]
      summary: Get all homepage content for an authorized admin
      responses:
        "200":
          description: Homepage content including hidden sections and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePage"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/home/summary:
    get:
      operationId: getAdminHomeSummary
      tags: [admin]
      summary: Get homepage publishing counts
      responses:
        "200":
          description: Homepage publishing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHomeSummary"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/site-settings:
    patch:
      operationId: updateSiteSettings
      tags: [admin]
      summary: Update shared college identity and navigation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Updated shared site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          description: Invalid settings
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/sections:
    post:
      operationId: createContentSection
      tags: [admin]
      summary: Create a page section
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentSectionInput"
      responses:
        "201":
          description: Created section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSection"
        "400":
          description: Invalid section
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/sections/{id}:
    patch:
      operationId: updateContentSection
      tags: [admin]
      summary: Update or reorder a page section
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentSectionUpdate"
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSection"
        "400":
          description: Invalid section
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Section not found
    delete:
      operationId: deleteContentSection
      tags: [admin]
      summary: Delete a page section and its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Section deleted
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Section not found
  /admin/items:
    post:
      operationId: createContentItem
      tags: [admin]
      summary: Create a repeatable homepage item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          description: Invalid item
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/items/{id}:
    patch:
      operationId: updateContentItem
      tags: [admin]
      summary: Update, hide, or reorder a repeatable homepage item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          description: Invalid item
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Item not found
    delete:
      operationId: deleteContentItem
      tags: [admin]
      summary: Delete a repeatable homepage item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Item deleted
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Item not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NavigationLink:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        path:
          type: string
          minLength: 1
          maxLength: 200
      required: [label, path]
    SiteSettings:
      type: object
      properties:
        id:
          type: string
        collegeName:
          type: string
        logoUrl:
          type: ["string", "null"]
        navigation:
          type: array
          items:
            $ref: "#/components/schemas/NavigationLink"
        footerNote:
          type: string
        updatedAt:
          type: string
          format: date-time
      required: [id, collegeName, logoUrl, navigation, footerNote, updatedAt]
    SiteSettingsUpdate:
      type: object
      properties:
        collegeName:
          type: string
          minLength: 1
          maxLength: 120
        logoUrl:
          type: ["string", "null"]
          maxLength: 2048
        navigation:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/NavigationLink"
        footerNote:
          type: string
          maxLength: 500
      minProperties: 1
    JsonObject:
      type: object
      additionalProperties: true
    ContentSection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pageSlug:
          type: string
        sectionKey:
          type: string
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        content:
          $ref: "#/components/schemas/JsonObject"
        isVisible:
          type: boolean
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - pageSlug
        - sectionKey
        - title
        - subtitle
        - content
        - isVisible
        - position
        - createdAt
        - updatedAt
    ContentSectionInput:
      type: object
      properties:
        pageSlug:
          type: string
          minLength: 1
          maxLength: 100
        sectionKey:
          type: string
          minLength: 1
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 160
        subtitle:
          type: ["string", "null"]
          maxLength: 300
        content:
          $ref: "#/components/schemas/JsonObject"
        isVisible:
          type: boolean
        position:
          type: integer
          minimum: 0
      required: [pageSlug, sectionKey, title, subtitle, content, isVisible, position]
    ContentSectionUpdate:
      type: object
      properties:
        pageSlug:
          type: string
          minLength: 1
          maxLength: 100
        sectionKey:
          type: string
          minLength: 1
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 160
        subtitle:
          type: ["string", "null"]
          maxLength: 300
        content:
          $ref: "#/components/schemas/JsonObject"
        isVisible:
          type: boolean
        position:
          type: integer
          minimum: 0
      minProperties: 1
    ContentItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        itemType:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        linkPath:
          type: ["string", "null"]
        label:
          type: ["string", "null"]
        content:
          $ref: "#/components/schemas/JsonObject"
        isVisible:
          type: boolean
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - sectionId
        - itemType
        - title
        - description
        - imageUrl
        - linkPath
        - label
        - content
        - isVisible
        - position
        - createdAt
        - updatedAt
    ContentItemInput:
      type: object
      properties:
        sectionId:
          type: string
          format: uuid
        itemType:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: ["string", "null"]
          maxLength: 1500
        imageUrl:
          type: ["string", "null"]
          maxLength: 2048
        linkPath:
          type: ["string", "null"]
          maxLength: 500
        label:
          type: ["string", "null"]
          maxLength: 100
        content:
          $ref: "#/components/schemas/JsonObject"
        isVisible:
          type: boolean
        position:
          type: integer
          minimum: 0
      required:
        - sectionId
        - itemType
        - title
        - description
        - imageUrl
        - linkPath
        - label
        - content
        - isVisible
        - position
    ContentItemUpdate:
      type: object
      properties:
        sectionId:
          type: string
          format: uuid
        itemType:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: ["string", "null"]
          maxLength: 1500
        imageUrl:
          type: ["string", "null"]
          maxLength: 2048
        linkPath:
          type: ["string", "null"]
          maxLength: 500
        label:
          type: ["string", "null"]
          maxLength: 100
        content:
          $ref: "#/components/schemas/JsonObject"
        isVisible:
          type: boolean
        position:
          type: integer
          minimum: 0
      minProperties: 1
    HomePage:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/SiteSettings"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ContentSection"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentItem"
      required: [settings, sections, items]
    AdminHomeSummary:
      type: object
      properties:
        sectionCount:
          type: integer
        visibleSectionCount:
          type: integer
        hiddenSectionCount:
          type: integer
        itemCount:
          type: integer
        visibleItemCount:
          type: integer
        hiddenItemCount:
          type: integer
      required:
        - sectionCount
        - visibleSectionCount
        - hiddenSectionCount
        - itemCount
        - visibleItemCount
        - hiddenItemCount

