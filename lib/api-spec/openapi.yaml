openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Shared API for Shastra Junior College public content and administration.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: home
    description: Public homepage content
  - name: admin
    description: Protected homepage content administration
  - name: enquiries
    description: Public admissions enquiries and the protected staff inbox
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /home:
    get:
      operationId: getHomePage
      tags: [home]
      summary: Get published homepage content
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePage"
  /pages/{pageSlug}:
    get:
      operationId: getCmsPage
      tags: [home]
      summary: Get published Faculty or Gallery content
      parameters:
        - name: pageSlug
          in: path
          required: true
          schema:
            type: string
            enum: [faculty, gallery]
      responses:
        "200":
          description: Published page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"
        "404":
          description: Page not found
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit a public admissions enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicEnquirySubmission"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryReceipt"
        "400":
          description: The enquiry does not match the active form.
  /admin/enquiries:
    get:
      operationId: getAdminEnquiries
      tags: [admin]
      summary: List admissions enquiries for authorized staff
      responses:
        "200":
          description: Enquiry inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnquiries"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/enquiries/{id}:
    patch:
      operationId: updateEnquiry
      tags: [admin]
      summary: Update an enquiry's inbox status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnquiryStatus"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnquiry"
        "400":
          description: Invalid status
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Enquiry not found
    delete:
      operationId: deleteEnquiry
      tags: [admin]
      summary: Soft-delete an enquiry so it can be restored
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted enquiry identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryActionResult"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Enquiry not found
  /admin/enquiries/{id}/restore:
    post:
      operationId: restoreEnquiry
      tags: [admin]
      summary: Restore a soft-deleted enquiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Restored enquiry identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryActionResult"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Deleted enquiry not found
  /admin/home:
    get:
      operationId: getAdminHome
      tags: [admin]
      summary: Get all homepage content for an authorized admin
      responses:
        "200":
          description: Homepage content including hidden sections and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePage"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/pages/{pageSlug}:
    get:
      operationId: getAdminCmsPage
      tags: [admin]
      summary: Get Faculty or Gallery content for authorized staff
      parameters:
        - name: pageSlug
          in: path
          required: true
          schema:
            type: string
            enum: [faculty, gallery]
      responses:
        "200":
          description: Page content including unpublished sections and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Page not found
  /admin/home/summary:
    get:
      operationId: getAdminHomeSummary
      tags: [admin]
      summary: Get homepage publishing counts
      responses:
        "200":
          description: Homepage publishing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHomeSummary"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/site-settings:
    patch:
      operationId: updateSiteSettings
      tags: [admin]
      summary: Update shared college identity and navigation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Updated shared site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          description: Invalid settings
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a public college asset from PRIVATE_OBJECT_DIR
      description: Streams a logo or other published asset uploaded by an authorized admin.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within PRIVATE_OBJECT_DIR, such as uploads/uuid.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/sections:
    post:
      operationId: createContentSection
      tags: [admin]
      summary: Create a page section
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentSectionInput"
      responses:
        "201":
          description: Created section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSection"
        "400":
          description: Invalid section
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/sections/{id}:
    patch:
      operationId: updateContentSection
      tags: [admin]
      summary: Update or reorder a page section
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentSectionUpdate"
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSection"
        "400":
          description: Invalid section
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Section not found
    delete:
      operationId: deleteContentSection
      tags: [admin]
      summary: Delete a page section and its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Section deleted
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Section not found
  /admin/items:
    post:
      operationId: createContentItem
      tags: [admin]
      summary: Create a repeatable homepage item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          description: Invalid item
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
  /admin/items/{id}:
    patch:
      operationId: updateContentItem
      tags: [admin]
      summary: Update, hide, or reorder a repeatable homepage item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          description: Invalid item
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Item not found
    delete:
      operationId: deleteContentItem
      tags: [admin]
      summary: Delete a repeatable homepage item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Item deleted
        "401":
          description: Sign-in required
        "403":
          description: The signed-in account is not an authorized admin
        "404":
          description: Item not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NavigationLink:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        path:
          type: string
          minLength: 1
          maxLength: 200
      required: [label, path]
    SiteSettings:
      type: object
      properties:
        id:
          type: string
        collegeName:
          type: string
        headerTagline:
          type: string
        logoUrl:
          type: ["string", "null"]
        navigation:
          type: array
          items:
            $ref: "#/components/schemas/NavigationLink"
        footerNote:
          type: string
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - collegeName
        - headerTagline
        - logoUrl
        - navigation
        - footerNote
        - primaryColor
        - accentColor
        - updatedAt
    SiteSettingsUpdate:
      type: object
      properties:
        collegeName:
          type: string
          minLength: 1
          maxLength: 120
        headerTagline:
          type: string
          maxLength: 120
        logoUrl:
          type: ["string", "null"]
          maxLength: 2048
        navigation:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/NavigationLink"
        footerNote:
          type: string
          maxLength: 500
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
      minProperties: 1
    PublicEnquirySubmission:
      type: object
      properties:
        values:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 1000
      required: [values]
    EnquiryAnswer:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        value:
          type: string
      required: [name, label, value]
    EnquiryStatus:
      type: string
      enum: [new, reviewed]
    AdminEnquiry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        answers:
          type: array
          items:
            $ref: "#/components/schemas/EnquiryAnswer"
        status:
          $ref: "#/components/schemas/EnquiryStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, answers, status, createdAt, updatedAt]
    AdminEnquiries:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminEnquiry"
      required: [items]
    EnquiryActionResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required: [id]
    EnquiryReceipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        receivedAt:
          type: string
          format: date-time
      required: [id, receivedAt]
    UpdateEnquiryStatus:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/EnquiryStatus"
      required: [status]
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file.
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
          description: Normalized object path to save in site settings.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
      required: [error]
    JsonObject:
      type: object
      additionalProperties: true
    ContentSection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pageSlug:
          type: string
        sectionKey:
          type: string
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        content:
          $ref: "#/components/schemas/JsonObject"
        isVisible:
          type: boolean
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - pageSlug
        - sectionKey
        - title
        - subtitle
        - content
        - isVisible
        - position
        - createdAt
        - updatedAt
    ContentSectionInput:
      type: object
      properties:
        pageSlug:
          type: string
          minLength: 1
          maxLength: 100
        sectionKey:
          type: string
          minLength: 1
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 160
        subtitle:
          type: ["string", "null"]
          maxLength: 300
        content:
          $ref: "#/components/schemas/JsonObject"
        isVisible:
          type: boolean
        position:
          type: integer
          minimum: 0
      required: [pageSlug, sectionKey, title, subtitle, content, isVisible, position]
    ContentSectionUpdate:
      type: object
      properties:
        pageSlug:
          type: string
          minLength: 1
          maxLength: 100
        sectionKey:
          type: string
          minLength: 1
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 160
        subtitle:
          type: ["string", "null"]
          maxLength: 300
        content:
          $ref: "#/components/schemas/JsonObject"
        isVisible:
          type: boolean
        position:
          type: integer
          minimum: 0
      minProperties: 1
    ContentItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        itemType:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        linkPath:
          type: ["string", "null"]
        label:
          type: ["string", "null"]
        content:
          $ref: "#/components/schemas/JsonObject"
        isVisible:
          type: boolean
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - sectionId
        - itemType
        - title
        - description
        - imageUrl
        - linkPath
        - label
        - content
        - isVisible
        - position
        - createdAt
        - updatedAt
    ContentItemInput:
      type: object
      properties:
        sectionId:
          type: string
          format: uuid
        itemType:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: ["string", "null"]
          maxLength: 1500
        imageUrl:
          type: ["string", "null"]
          maxLength: 2048
        linkPath:
          type: ["string", "null"]
          maxLength: 500
        label:
          type: ["string", "null"]
          maxLength: 100
        content:
          $ref: "#/components/schemas/JsonObject"
        isVisible:
          type: boolean
        position:
          type: integer
          minimum: 0
      required:
        - sectionId
        - itemType
        - title
        - description
        - imageUrl
        - linkPath
        - label
        - content
        - isVisible
        - position
    ContentItemUpdate:
      type: object
      properties:
        sectionId:
          type: string
          format: uuid
        itemType:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: ["string", "null"]
          maxLength: 1500
        imageUrl:
          type: ["string", "null"]
          maxLength: 2048
        linkPath:
          type: ["string", "null"]
          maxLength: 500
        label:
          type: ["string", "null"]
          maxLength: 100
        content:
          $ref: "#/components/schemas/JsonObject"
        isVisible:
          type: boolean
        position:
          type: integer
          minimum: 0
      minProperties: 1
    HomePage:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/SiteSettings"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ContentSection"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentItem"
      required: [settings, sections, items]
    CmsPage:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/SiteSettings"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ContentSection"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentItem"
      required: [settings, sections, items]
    AdminHomeSummary:
      type: object
      properties:
        sectionCount:
          type: integer
        visibleSectionCount:
          type: integer
        hiddenSectionCount:
          type: integer
        itemCount:
          type: integer
        visibleItemCount:
          type: integer
        hiddenItemCount:
          type: integer
      required:
        - sectionCount
        - visibleSectionCount
        - hiddenSectionCount
        - itemCount
        - visibleItemCount
        - hiddenItemCount

